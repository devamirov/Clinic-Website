<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- Philips Healthcare Logo -->
  <g>
    <!-- Philips Circular Waves/Shield Icon -->
    <circle cx="35" cy="45" r="25" stroke="#1E22AA" stroke-width="3" fill="none"/>
    <circle cx="35" cy="45" r="18" stroke="#1E22AA" stroke-width="2.5" fill="none"/>
    <circle cx="35" cy="45" r="12" stroke="#1E22AA" stroke-width="2" fill="none"/>
    <circle cx="35" cy="45" r="6" fill="#1E22AA"/>
    
    <!-- Alternating pattern lines -->
    <path d="M 10 45 L 35 30 L 60 45" stroke="#1E22AA" stroke-width="2" fill="none"/>
    <path d="M 10 45 L 35 60 L 60 45" stroke="#1E22AA" stroke-width="2" fill="none"/>
    
    <!-- Philips Text -->
    <text x="75" y="42" font-family="'Arial', 'Helvetica', sans-serif" font-size="30" font-weight="bold" fill="#1E22AA" letter-spacing="2px">PHILIPS</text>
    <text x="75" y="65" font-family="'Arial', 'Helvetica', sans-serif" font-size="16" font-weight="600" fill="#666666" letter-spacing="1px">HEALTHCARE</text>
  </g>
</svg>
